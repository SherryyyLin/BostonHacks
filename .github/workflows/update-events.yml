name: Update public hackathon feed

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-hackathon-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and failure handling
        run: python -m unittest discover -s Backend/tests -v
      - name: Refresh public sources
        id: collect
        continue-on-error: true
        run: python Backend/collector.py
      - name: Commit feed and source-health report
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add Backend/feeds/events.json Backend/feeds/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public hackathon feed"
            git push
          fi
      - name: Report complete source failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collection failed. Existing event data was preserved; inspect Backend/feeds/status.json and logs."
          exit 1
